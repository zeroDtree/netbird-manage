[project]
name = "netbird-user-manage"
version = "0.1.0"
description = "NetBird bulk user import and machine-to-user assignment (CLI + optional HTTP API)"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
netbird-user-manage = "user_manage:main"
netbird-assign = "policy_manage:main"
netbird-assign-api = "assign_api:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

# Ship the single CLI module at repo root (no package directory).
[tool.hatch.build.targets.wheel.force-include]
"user_manage.py" = "user_manage.py"
"netbird_client.py" = "netbird_client.py"
"netbird_cli.py" = "netbird_cli.py"
"netbird_validation.py" = "netbird_validation.py"
"netbird_users.py" = "netbird_users.py"
"netbird_groups.py" = "netbird_groups.py"
"netbird_policies.py" = "netbird_policies.py"
"netbird_peers.py" = "netbird_peers.py"
"assign_core.py" = "assign_core.py"
"policy_manage.py" = "policy_manage.py"
"assign_api.py" = "assign_api.py"
