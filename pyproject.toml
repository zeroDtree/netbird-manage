[project]
name = "netbird_manage"
version = "0.1.0"
description = "NetBird bulk user import and machine-to-user assignment (CLI + optional HTTP API)"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
user-manage = "netbird_manage.cli.user_manage:main"
policy-manage = "netbird_manage.cli.policy_manage:main"
expose-api = "netbird_manage.api.expose_api:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a6",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbird_manage"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ty.src]
include = ["src"]
